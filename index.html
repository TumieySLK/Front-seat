<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taxi Payment Tracker</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

  </head>
  <body>
    
    <!--Navbar-->
    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand">Taxi Payment Tracker</a>
  </div>
</nav>
<br>

<!--Route Selection-->
<div class="Route">
<select class="form-select" aria-label="Select a route">
  <option selected>Select a route</option>
  <option value="1">Bree to Bara</option>
  <option value="2">Noord to Alexandra</option>
  <option value="3">Turffontein to Johannesburg CBD</option>
</select>
</div>
<br>

<!--Payment Selection-->
<form>
  <!-- Row -->
  <div class="mb-3">
    <label for="row" class="form-label">Row</label>
    <select class="form-select" id="row">
      <option selected>Select a row</option>
      <option value="Front">Front</option>
      <option value="Row 1">Row 1</option>
      <option value="Row 2">Row 2</option>
      <option value="Row 3">Row 3</option>
      <option value="Row 4">Row 4</option>
    </select>
  </div>
 <br>
  <!-- Number of people -->
  <div class="mb-3">
    <label for="people" class="form-label">Number of people</label>
    <input type="number" class="form-control" id="people">
  </div>
 <br>
  <!-- Amount handed over -->
  <div class="mb-3">
    <label for="amount" class="form-label">Amount handed over</label>
    <input type="number" class="form-control" id="amount">
  </div>
 <br>
  <!-- Submit -->
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
</div>

<!--Alert-->
<div id="alertmessage" class="alert alert-danger d-none" role="alert">
  <!-- Alert message will be displayed here -->
</div>
</div>

<!--Cards-->
<div class="container text-center">
<div class="row">
  <div class="col-6">
    <div class="card text-center">
    <div class="card-body">
    <h4 class="card-title">Seats Paid</h4>
      <h5 id="seatsPaid">0/15</h5>
   </div>
   <div class="col-6">
    <div class="card text-center">
    <div class="card-body">
      <h4 class="card-title">Seats Left</h4>
      <h5 id="seatsLeft">15</h5>
    </div>
    <div class="col-6">   
      <div class="card text-center">
      <div class="card-body">
        <h4 class="card-title">Fares Collected</h4>
          <h5 id="totalFares">R0</h5>
          </div>
    <div class="col-6"> 
      <div class="card text-center">
      <div class="card-body">
        <h4 class="card-title">Change Owed</h4>
        <h5 id="totalChange">R0</h5>
          </div>
          </div>
        </div>

  <!--Remaining Payments-->
<div class="card" style="width: 18rem;">
  <div class="card-header">
    <h4 class="card-title">Payments</h4>
  </div>
  <ul id="paymentslist" class="list-group">
    <li class="list-group-item">No payments recorded yet</li>
  </ul>
</div>
</div>
</div>
<div class="card" style="width: 18rem;">
  <div class="card-header">
    <h4 class="card-title">Change owed</h4>
  </div>
  <ul id="changelist" class="list-group">
    <li class="list-group-item">No change owed</li>
    <button type="button" class="btn btn-outline-success">Success</button>
  </ul>
</div>
</div>


<script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  </body>
</html>
