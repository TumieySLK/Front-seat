<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taxi Payment Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

  </head>
  <body>
    <!--Navbar-->
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
       <span class="navbar-text text-white">Taxi Payment Tracker</span>
    </div>
</nav>
<br>
<!--Route Selection-->
<div class="Route">
<select class="form-select" aria-label="Default select example">
  <option selected>Select a route</option>
  <option value="1">Bree to Bara</option>
  <option value="2">Noord to Alexandra</option>
  <option value="3">Turffontein to Johannesburg CBD</option>
</select>
</div>
<br>
<!--Payment Selection-->
<form>
  <div class="mb-3">
    <label for="amount" class="form-label">Enter Amount Paid</label>
    <input type="number" class="form-control" id="amount" aria-describedby="amountHelp">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
<div class="container text-center">
  <div class="row">
    <div class="col-6"><div class="card text-center">
     <div class="card-body">
        <h5 class="card-title">Seats Paid</h5>
         <h3 id="seatsPaid">0/15</h3>
    </div>
    <div class="col-6">
     <div class="card text-center">
      <div class="card-body">
       <h5 class="card-title">Seats Left</h5>
                <h4 id="seatsLeft">15</h4>
            </div>
    <div class="col-6">   <div class="card text-center">
            <div class="card-body">
                <h6 class="card-title">Fares Collected</h6>
                <h4 id="totalFares">R0</h4>
            </div>
    <div class="col-6"> <div class="card text-center">
            <div class="card-body">
                <h6 class="card-title">Change Owed</h6>
                <h4 id="totalChange">R0</h4></div>
  </div>
</div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  </body>
</html>
